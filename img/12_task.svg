  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">На окружности отмечено n точек, каждая пара соединена хордой, никакие три хорды</text>
  <text x="40" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">не проходят через одну точку. На сколько частей разделится круг при 6 точках?</text>
