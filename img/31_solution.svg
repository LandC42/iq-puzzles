  <text x="225" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">девять</text>
  <text x="295" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">ноль</text>
  <text x="365" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">один</text>
  <text x="435" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">пять</text>
  <text x="505" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">семь</text>
  <text x="575" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">три</text>
  <text x="645" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">четыре</text>
  <text x="715" y="374" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="normal" fill="#444444" text-anchor="middle">шесть</text>
  <text x="40" y="567" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#27AE60" text-anchor="start">Ответ: C — между 9 и 0. Цифры стоят по алфавиту названий; «десять» — после «девять»</text>
  <text x="40" y="588" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#27AE60" text-anchor="start">(в &lt; с) и перед «ноль».</text>
