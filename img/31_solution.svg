  <rect width="800" height="600" fill="#FFFFFF"/>
  <text x="40" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="start">Задача 31</text>
  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">Цифры выстроены по одному правилу. Где в этом ряду должно встать число 10?</text>
