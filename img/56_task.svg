  <text x="40" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="start">Задача 56</text>
  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">В каждую клетку поставьте дом высотой 1–4 так, чтобы в каждой строке и каждом</text>
  <text x="40" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">столбце высоты не повторялись. Число у края — сколько домов видно с этой</text>
  <text x="40" y="128" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">стороны (высокий дом закрывает низкие за ним). Какой будет выделенная строка?</text>
