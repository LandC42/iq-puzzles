  <text x="40" y="588" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#27AE60" text-anchor="start">Ответ: B — 3. ● = 2, ■ = 3, ▲ = 5; рычаг: ★·2 = (5 + 5 + 2 + 2)·1 → ★ = 7; ★ + ● = 9 = 3 ■.</text>
