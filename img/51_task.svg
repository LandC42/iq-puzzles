  <text x="40" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="start">Задача 51</text>
  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">Муравей на белой клетке поворачивает на 90° направо, на чёрной — налево. Затем</text>
  <text x="40" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">он перекрашивает клетку в противоположный цвет и шагает на клетку вперёд.</text>
  <text x="40" y="128" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">Показаны шаг 0 и шаг 4. Каким будет поле после 10 шагов?</text>
