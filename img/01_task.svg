  <text x="40" y="48" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="bold" fill="#222222" text-anchor="start">Задача 1</text>
  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">Каждой букве всегда соответствует одна и та же пара «цвет + форма». Важны и</text>
  <text x="40" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">цвет, и форма: жёлтый квадрат и жёлтый круг — разные буквы. Открыта только</text>
  <text x="40" y="128" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">одна буква — «Ч». Расшифруйте слова и назовите букву на месте «?».</text>
