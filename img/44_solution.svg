  <text x="339" y="464.92" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">GENIUS</text>
  <text x="339" y="491" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">Ge·Ni·U·S</text>
  <text x="339" y="544" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">C</text>
