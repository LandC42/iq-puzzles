  <rect x="440" y="192" width="50" height="50" rx="0" fill="#1ABC9C" stroke="#222222" stroke-width="2"/>
  <text x="445" y="205" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="start">7</text>
  <text x="465" y="227.92" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>
  <rect x="40" y="410" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#D0D3D8" stroke-width="2"/>
