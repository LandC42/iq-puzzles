  <rect x="525" y="407" width="116" height="116" fill="none" stroke="#27AE60" stroke-width="5" rx="4"/>
  <text x="40" y="588" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#27AE60" text-anchor="start">Ответ: E — MAGIC. Нет ни «M», ни «Ma»: на M начинаются только Mc, Md, Mg, Mn, Mo, Mt.</text>
