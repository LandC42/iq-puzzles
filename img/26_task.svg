  <text x="40" y="80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">Шифр тот же: пара «цвет + форма» однозначно задаёт букву. Слева восемь слов</text>
  <text x="40" y="104" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" fill="#444444" text-anchor="start">одного ряда в естественном порядке, одна буква открыта. Подсказка выглядывает</text>
